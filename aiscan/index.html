  const l=document.getElementById(id),i=l.querySelector('input');
  i.addEventListener('change',()=>{A[key]=i.checked;l.classList.toggle('on',i.checked);});});
 document.getElementById('submit').onclick=submit;
 animeerStats();toTop();}

const chk=(id,key,txt)=>'<label class="check'+(A[key]?' on':'')+'" id="'+id+'">'+
 '<input type="checkbox"'+(A[key]?' checked':'')+'><span class="cbox">'+CHK+'</span><span>'+txt+'</span></label>';

function submit(){
 const e=document.getElementById('lerr'),b=document.getElementById('submit');
 const fail=m=>{e.textContent=m;e.classList.remove('hidden');};
 if(!(A.L_name||'').trim())return fail('Vul je naam in.');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((A.L_email||'').trim()))return fail('Vul een geldig e-mailadres in.');
  if(!(A.L_co||'').trim())return fail('Vul de naam van je bedrijf in.');
  if(!A.L_ok)return fail('Vink het akkoord aan om je rapport te bekijken.');
 e.classList.add('hidden');LEAD.ok=true;b.disabled=true;
 document.getElementById('lmsg').textContent='Momentje\u2026';
 track('e-mail achtergelaten');
 report(pending);
 send();}

function send(){
 const payload={scan:pending,naam:A.L_name,email:A.L_email,
  functie:A.L_func,bedrijf:A.L_co,grootte:A.L_size,sector:A.L_sector||'',nieuwsbrief:!!A.L_news,
  rol:role?role.n:null,bron:BRON,samenvatting:HEAD[pending](),
  antwoorden:Object.fromEntries(Object.entries(A).filter(([k])=>!k.startsWith('L_'))),
  rapport_html:buildRapportDoc(pending)};
 return supaInsert('scans',payload);}


const SHARE_URL="https://madaco.be/aiscan";
function shareBlok(kind){
 const url=SHARE_URL||(location&&location.href?location.href.split('#')[0]:'');
 const T={persoon:'een scan die toont waar AI in je eigen werk het meeste oplevert',
  bedrijf:'een scan die toont waar in een bedrijf AI vandaag het meeste oplevert',
  kader:'een scan die toont of je organisatie klaar is om met AI te werken'}[kind];
 const onderwerp=encodeURIComponent('Ik denk dat dit iets voor jou is');
 const body=encodeURIComponent('Dag,\n\nIk heb net '+T+' ingevuld. Het duurt een tiental minuten en je krijgt meteen een rapport met dingen die je zelf kan uitproberen.\n\n'+url+'\n\nBenieuwd wat er bij jou uitkomt.');
 return'<div class="panel accent noprint" data-strip style="margin-top:26px"><div class="phead">'+sq('user')+
 '<div><h3>Vond je dit nuttig?</h3><p style="color:var(--mute);font-size:15px;margin:4px 0 0">'+
 'Stuur het door naar iemand die er ook iets aan heeft. Een collega, een mede-ondernemer, of iemand in je team die met dit soort werk bezig is.</p></div></div>'+
 '<div class="actions" style="padding-top:18px">'+
 '<a class="btn btn-p" href="mailto:?subject='+onderwerp+'&body='+body+'">Doorsturen per mail'+svg('arrowR')+'</a>'+
 (url?'<button class="btn btn-s" id="cplink">'+svg('copy')+'Kopieer de link</button>':'')+
 '</div><p class="note" id="cpmsg" style="margin-top:10px"></p></div>';}

/* ---- RAPPORT ---- */
const hero=(kind,h)=>'<div class="hero"><p class="eyebrow">'+svg('flag')+'Rapport &middot; '+TITLES[kind]+'</p>'+
 '<h1>'+(h.title||TITLES[kind])+'</h1><p>'+h.line+'</p></div>';
const stats=h=>'<div class="bento bento-'+h.stats.length+'">'+h.stats.map(s=>{
 const suf=s.u?'<em>'+s.u+'</em>':'';
 const f=Math.round(Math.max(0,Math.min(1,s.f||0))*100);
 return'<div class="stat">'+sq(s.i||'target','on')+
  '<p class="n" data-to="'+s.n+'" data-suf="'+(s.u||'')+'">'+s.n+suf+'</p>'+
  '<p class="l">'+s.l+'</p>'+(s.k?'<p class="k">'+s.k+'</p>':'')+
  '<div class="track"><i data-w="'+f+'"></i></div></div>';}).join('')+'</div>';

/* de cijfers tellen op en de balken lopen vol, tenzij de bezoeker beweging uitzet */
function animeerStats(){
 const stil=!window.requestAnimationFrame||(window.matchMedia&&
  window.matchMedia('(prefers-reduced-motion: reduce)').matches);
 root.querySelectorAll('.stat').forEach(el=>{
  const n=el.querySelector('.n'),b=el.querySelector('.track i');
  const w=b?(b.getAttribute('data-w')||'0'):'0';
  const to=n?parseFloat(n.getAttribute('data-to')):NaN;
  const suf=n?(n.getAttribute('data-suf')||''):'';
  const eind=()=>{if(b)b.style.width=w+'%';
   if(n&&isFinite(to))n.innerHTML=to+(suf?'<em>'+suf+'</em>':'');};
  if(stil){eind();return;}
  if(n&&isFinite(to))n.innerHTML='0'+(suf?'<em>'+suf+'</em>':'');
  const start=Date.now(),duur=700;
  const stap=()=>{const p=Math.min((Date.now()-start)/duur,1),e=1-Math.pow(1-p,3);
   if(n&&isFinite(to))n.innerHTML=Math.round(to*e)+(suf?'<em>'+suf+'</em>':'');
   if(p<1)window.requestAnimationFrame(stap);else eind();};
  window.requestAnimationFrame(()=>{if(b)b.style.width=w+'%';stap();});});}

const MEENEMEN={
 persoon:['Alles wat hierboven staat, inclusief je prompts, in &eacute;&eacute;n bestand dat offline opent.',
  'Door te sturen naar je zaakvoerder of je collega, zodat jullie hetzelfde voor ogen hebben.',
  'Over drie maanden opnieuw te openen, om te vergelijken met waar je dan staat.'],
 bedrijf:['Alle acht de gebieden met hun tests en bouwvoorstellen, in &eacute;&eacute;n bestand dat offline opent.',
  'Door te sturen naar je directieteam of je IT-partner, als vertrekpunt voor het gesprek.',
  'Over drie maanden opnieuw in te vullen, om te zien wat er bewogen heeft.'],
 kader:['Je score per pijler met de twee eerste stappen, in &eacute;&eacute;n bestand dat offline opent.',
  'Door te sturen naar wie bij jullie over afspraken en opleiding gaat.',
  'Bruikbaar als bijlage bij je beleid, want de AI Act vraagt dat je kan tonen wat je gedaan hebt.']};

function report(kind){
 const h=HEAD[kind]();
 root.innerHTML=hero(kind,h)+stats(h)+
 '<div class="keep noprint" data-strip>'+svg('alert')+
 '<span>Dit rapport bestaat enkel in dit venster. Sluit je de pagina, dan is het weg. '+
 '<button class="lnk" id="dl2">Bewaar het nu</button>.</span></div>'+
 BODY[kind]()+
 '<div class="panel" style="margin-top:26px"><div class="phead">'+sq('arrowR')+'<div><h3>'+nextLine()+'</h3><p style="color:var(--mute);font-size:15px;margin-top:4px">'+nextHint()+'</p></div></div></div>'+
 shareBlok(kind)+
 '<div class="panel accent noprint" data-strip style="margin-top:26px"><div class="phead">'+sq('download')+
 '<div><h3>Neem je rapport mee</h3><p class="sub">Je krijgt een bestand dat je kan bewaren, doorsturen en later opnieuw openen.</p></div></div>'+
 buit(MEENEMEN[kind])+
 '<div class="actions" style="padding-top:0"><button class="btn btn-p" id="dl">Download je rapport'+svg('download')+'</button>'+
 '<button class="btn btn-s" id="prt">'+svg('printer')+'Bewaar als pdf</button>'+
 '<button class="btn btn-s" id="home">'+svg('home')+'Terug naar de scans</button></div>'+
 '<p class="note" id="msg" style="margin-top:12px"></p></div>';
 document.getElementById('home').onclick=hub;
 document.getElementById('prt').onclick=()=>window.print();
 const cl=document.getElementById('cplink');
 if(cl)cl.onclick=()=>{navigator.clipboard.writeText(SHARE_URL||location.href.split('#')[0]).then(
  ()=>{document.getElementById('cpmsg').textContent='Link gekopieerd.';},
  ()=>{document.getElementById('cpmsg').textContent='Kopi\u00ebren lukte niet.';});};
 document.getElementById('dl').onclick=()=>download(kind);
 document.getElementById('dl2').onclick=()=>download(kind);
 wireCopy();animeerStats();toTop();}

function wireCopy(){
 root.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{
  const t=document.getElementById(b.dataset.copy).textContent;
  navigator.clipboard.writeText(t).then(()=>{b.textContent='Gekopieerd';
   setTimeout(()=>b.textContent='Kopieer',1800);},()=>{b.textContent='Selecteer handmatig';});});}

function nextLine(){const left=Object.keys(done).filter(k=>!done[k]);
 return left.length?'Doe ook de scan over '+TITLES[left[0]].toLowerCase():'Je hebt alle drie de scans gedaan';}
function nextHint(){const left=Object.keys(done).filter(k=>!done[k]);
 if(!left.length)return'Leg de drie rapporten naast elkaar. Waar jouw eigen winst en die van het bedrijf uit elkaar lopen, zit meestal het echte werk.';
 return{persoon:'Kijk wat er in jouw eigen week te winnen valt. Dat is het snelst voelbaar en je kan er deze week al mee starten.',
  bedrijf:'Breng in kaart waar in de organisatie het meeste te halen valt, met per gebied een test van een halfuur.',
  kader:'Bepaal of wat je bouwt ook blijft werken. Dit verfijnt meteen je bedrijfsrapport.'}[left[0]];}

function buildRapportDoc(kind){
 const kopie=root.cloneNode(true);
 kopie.querySelectorAll('[data-strip],.copy,.noprint').forEach(n=>n.remove());
 kopie.querySelectorAll('.track i').forEach(n=>{n.style.width=n.getAttribute('data-w')+'%';});
 kopie.querySelectorAll('.stat .n').forEach(n=>{const s=n.getAttribute('data-suf');
  n.innerHTML=n.getAttribute('data-to')+(s?'<em>'+s+'</em>':'');});
 const body=kopie.innerHTML;
 const who=[A.L_co,A.L_name].filter(Boolean).map(esc).join(' \u00b7 ');
 const date=new Date().toLocaleDateString('nl-BE',{day:'numeric',month:'long',year:'numeric'});
 return'<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8">'+
  '<meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-scan: '+
  TITLES[kind]+(A.L_co?': '+esc(A.L_co):'')+'</title>'+
  '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">'+
  '<style>'+document.querySelector('style').textContent+'</style></head><body><div class="wrap">'+
  body+'<footer>AI-scan \u00b7 '+TITLES[kind]+(who?' \u00b7 '+who:'')+' \u00b7 '+date+
  '. Dit rapport komt uit je eigen antwoorden en is een startpunt, geen audit.</footer></div></body></html>';}

function download(kind){
 track('rapport gedownload',kind);
 const doc=buildRapportDoc(kind);
 const blob=new Blob([doc],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 const slug=(A.L_co||kind).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||kind;
 a.href=url;a.download='ai-scan-'+kind+'-'+slug+'.html';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 const m=document.getElementById('msg');
 if(m)m.textContent='Bewaard als '+a.download+'. Open het bestand in je browser. Wil je er een pdf van, gebruik dan Afdrukken en kies Bewaren als pdf.';
 const k=root.querySelector('.keep');
 if(k){k.classList.add('done');
  k.innerHTML=svg('check')+'<span>Je rapport staat nu bij je downloads. Je kan deze pagina gerust sluiten.</span>';}}

track('link geopend');
hub();

</script>
</body>
